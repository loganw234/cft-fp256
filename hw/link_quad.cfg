# v++ link configuration for four tiles on the U50/U50C HBM platforms.
#
# Four independent CUs, each with FOUR AXI masters - one per operand
# stream - and each master on its own HBM pseudo-channel group. Sixteen
# masters across the 32 pseudo-channels the platform exposes, so
# 2 per master, generated by scratchpad/gen_link_quad.py rather than
# typed: an sp= line naming the wrong group does not fail the build, it
# quietly shares a group and puts back exactly the bottleneck the split
# existed to remove.
#
# Why the tiles time no worse than one, and possibly better: the
# single-CU design spans both SLRs of the VU35P, and its critical path
# is in the fp256 normalize/round stage - the kind of path an SLR
# crossing ruins. Four smaller CUs can each be placed compactly inside
# one SLR.
#
# Determinism is unaffected, by the same argument as ever. Element i of
# the output depends only on element i of the inputs, so which tile
# computed it cannot matter - and now, neither can which port fetched
# it. The determinism argument was never about the memory system; it is
# about the single compute issue point, and there is still exactly one
# per tile.
#
# libcft drives this. cft_run partitions n across the tiles, gives each
# its own buffers, ORs the four sets of sticky registers into one
# answer, and reports a single result - callers never learn that tiles
# exist. host/src/backend_xrt.cpp asks XRT for each argument's memory
# group per CU, which is what keeps a buffer in the bank its master can
# actually reach.
#
# Bandwidth headroom, for context: one tile at one beat per cycle pulls
# ~4.2 GB/s per stream at 130 MHz. 2 pseudo-channels is ~28.8 GB/s.
# Four tiles streaming flat out is ~67 GB/s of the 316 GB/s available,
# so the split is about port contention inside the kernel, not about
# running out of memory.

[connectivity]
nk=cft_krnl:4:cft_krnl_1.cft_krnl_2.cft_krnl_3.cft_krnl_4
sp=cft_krnl_1.m_axi_a:HBM[0:1]
sp=cft_krnl_1.m_axi_b:HBM[2:3]
sp=cft_krnl_1.m_axi_c:HBM[4:5]
sp=cft_krnl_1.m_axi_d:HBM[6:7]
sp=cft_krnl_2.m_axi_a:HBM[8:9]
sp=cft_krnl_2.m_axi_b:HBM[10:11]
sp=cft_krnl_2.m_axi_c:HBM[12:13]
sp=cft_krnl_2.m_axi_d:HBM[14:15]
sp=cft_krnl_3.m_axi_a:HBM[16:17]
sp=cft_krnl_3.m_axi_b:HBM[18:19]
sp=cft_krnl_3.m_axi_c:HBM[20:21]
sp=cft_krnl_3.m_axi_d:HBM[22:23]
sp=cft_krnl_4.m_axi_a:HBM[24:25]
sp=cft_krnl_4.m_axi_b:HBM[26:27]
sp=cft_krnl_4.m_axi_c:HBM[28:29]
sp=cft_krnl_4.m_axi_d:HBM[30:31]
