# v++ link configuration for four tiles on the U50/U50C HBM platforms.
#
# Four independent CUs, each with FOUR AXI masters - one per operand
# stream - and each master on its OWN single pseudo-channel. Sixteen
# masters, sixteen pseudo-channels, sixteen left over.
#
# One pseudo-channel per master, and exactly one, for the reason
# hw/link.cfg spells out: the engine pipelines ARs on a single ID with
# no reorder buffer, and a master that only ever talks to one
# pseudo-channel gets same-ID response ordering by construction instead
# of by trusting the HBM switch across destinations. The 2026-08-30
# audit flagged the old 2-per-master span; this closes it. Bandwidth
# was never the reason for the span (~9.9 GB/s available per channel
# against ~3.3 GB/s demand). Each argument buffer is capped at one
# channel's 256 MB per tile; libcft does not split by capacity, so an
# oversized run fails loudly at allocation - see hw/link.cfg.
#
# This also moves the scaling wall from four tiles (8 channels each,
# 32/8) to EIGHT (32/4) - docs/SCALING.md's analysis, now matched by
# the mapping it assumed.
#
# An sp= line naming the wrong group does not fail the build; it
# quietly shares a channel and puts back exactly the contention the
# split exists to remove. The mapping below is CU t, master m ->
# HBM[4t + m], written out in full so a wrong line is visible by
# inspection.
#
# Why the tiles time no worse than one, and possibly better: the
# single-CU design spans both SLRs of the VU35P, and its critical path
# is in the fp256 normalize/round stage - the kind of path an SLR
# crossing ruins. Four smaller CUs can each be placed compactly inside
# one SLR.
#
# Determinism is unaffected, by the same argument as ever. Element i of
# the output depends only on element i of the inputs, so which tile
# computed it cannot matter - and neither can which port fetched it.
# The determinism argument was never about the memory system; it is
# about the single compute issue point, and there is still exactly one
# per tile.
#
# libcft drives this. cft_run partitions n across the tiles, gives each
# its own buffers, ORs the four sets of sticky registers into one
# answer, and reports a single result - callers never learn that tiles
# exist. host/src/backend_xrt.cpp asks XRT for each argument's memory
# group per CU, which is what keeps a buffer in the bank its master can
# actually reach.

[connectivity]
nk=cft_krnl:4:cft_krnl_1.cft_krnl_2.cft_krnl_3.cft_krnl_4
sp=cft_krnl_1.m_axi_a:HBM[0]
sp=cft_krnl_1.m_axi_b:HBM[1]
sp=cft_krnl_1.m_axi_c:HBM[2]
sp=cft_krnl_1.m_axi_d:HBM[3]
sp=cft_krnl_2.m_axi_a:HBM[4]
sp=cft_krnl_2.m_axi_b:HBM[5]
sp=cft_krnl_2.m_axi_c:HBM[6]
sp=cft_krnl_2.m_axi_d:HBM[7]
sp=cft_krnl_3.m_axi_a:HBM[8]
sp=cft_krnl_3.m_axi_b:HBM[9]
sp=cft_krnl_3.m_axi_c:HBM[10]
sp=cft_krnl_3.m_axi_d:HBM[11]
sp=cft_krnl_4.m_axi_a:HBM[12]
sp=cft_krnl_4.m_axi_b:HBM[13]
sp=cft_krnl_4.m_axi_c:HBM[14]
sp=cft_krnl_4.m_axi_d:HBM[15]
