# v++ link configuration for four tiles on the U50/U50C HBM platforms.
#
# Four independent CUs, each with its own AXI master on its own group
# of four HBM pseudo-channels. Nothing about the RTL changes - a tile
# is already a self-contained kernel - so this file plus a host that
# partitions the work is the whole of "multi-tile".
#
# Why this is expected to time no worse than one tile, and possibly
# better: the single-CU design spans both SLRs of the VU35P (164k LUTs
# in SLR0, 57k in SLR1, 3472 crossings), and its critical path is a
# 717-bit reduce-then-broadcast in the fp256 normalize stage - exactly
# the kind of path an SLR crossing ruins. Four smaller CUs can each be
# placed compactly inside one SLR.
#
# Determinism is unaffected. Element i of the output depends only on
# element i of the inputs, so which tile computed it cannot matter.
# What DOES change is bookkeeping: each CU has its own FLAGS and
# STATUS registers, and the host must OR them across tiles to get the
# run's sticky words. The host library owns that so callers never see
# it.
#
# Pseudo-channel groups are contiguous here for legibility. Spreading
# each CU's group across HBM stacks is a bandwidth tuning knob worth
# measuring on silicon, not guessing at now: at four tiles the design
# pulls ~46 GB/s of the 316 GB/s available, so there is no wall to
# tune away from yet.

[connectivity]
nk=cft_krnl:4:cft_krnl_1.cft_krnl_2.cft_krnl_3.cft_krnl_4
sp=cft_krnl_1.m00_axi:HBM[0:3]
sp=cft_krnl_2.m00_axi:HBM[4:7]
sp=cft_krnl_3.m00_axi:HBM[8:11]
sp=cft_krnl_4.m00_axi:HBM[12:15]
