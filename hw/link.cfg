# v++ link configuration for the U50/U50C HBM platforms.
#
# One CU in v0. The engine's single m00_axi master maps onto the first
# four HBM pseudo-channels; widen or re-map when CU count grows.

[connectivity]
nk=cft_krnl:1:cft_krnl_1
sp=cft_krnl_1.m00_axi:HBM[0:3]
