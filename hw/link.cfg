# v++ link configuration for the U50/U50C HBM platforms.
#
# One CU, four masters - one per operand stream.
#
# The masters must land on DIFFERENT pseudo-channel groups, and that is
# the whole point of splitting them. The engine used to share a single
# 256-bit port between three operand reads and one result write, which
# costs four transfers per beat through a port that retires one per
# cycle: ~4.4 cycles/beat, whatever the arithmetic could do. Giving each
# stream its own port removes that, but only if the ports do not queue
# behind each other again one level down.
#
# Each group is 4 pseudo-channels (1 GB, 4x14.4 GB/s). One tile at one
# beat per cycle pulls ~4.2 GB/s per stream at 130 MHz, so a single
# pseudo-channel would do; four are used because HBM[i] granularity is
# what the platform exposes and there is no reason to be tighter.

[connectivity]
nk=cft_krnl:1:cft_krnl_1
sp=cft_krnl_1.m_axi_a:HBM[0:3]
sp=cft_krnl_1.m_axi_b:HBM[4:7]
sp=cft_krnl_1.m_axi_c:HBM[8:11]
sp=cft_krnl_1.m_axi_d:HBM[12:15]

# Bring-up clock constraint (docs/BRINGUP.md gate 3): the v0 behavioural
# core will not close the platform default. Uncomment to pin the kernel
# clock low; determinism is clock-independent, so results are identical.
#[clock]
#freqHz=100000000:cft_krnl_1
