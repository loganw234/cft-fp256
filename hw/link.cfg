# v++ link configuration for the U50/U50C HBM platforms.
#
# One CU, four masters - one per operand stream.
#
# ONE pseudo-channel per master, and exactly one, because ordering is
# then true by construction. The engine pipelines ARs on a single ID
# and fills its FIFOs in arrival order with no reorder buffer; AXI
# guarantees same-ID responses return in issue order. Spanning a master
# across several pseudo-channels (this file used to say HBM[0:3]) makes
# that guarantee depend on the HBM switch preserving same-ID order
# ACROSS destinations - which AMD's AXI implementation is documented to
# do, but "the switch documentation says so" is a weaker fact than "the
# master only ever talks to one place". The 2026-08-30 audit flagged
# the span; this closes it.
#
# Bandwidth: one pseudo-channel is ~9.9 GB/s effective against a
# master's ~3.3 GB/s demand at 130 MHz and 1.25 cycles/beat, so the
# restriction costs nothing the engine can use.
#
# Capacity: one pseudo-channel is 256 MB (8 GB / 32), so each argument
# buffer is capped at 256 MB per tile - 8M fp256 elements, 64M fp32.
# libcft does NOT currently split by capacity (slice.h divides by tile
# count only), so a larger single run fails LOUDLY at buffer allocation
# rather than being quietly serialised. The old 4-channel group allowed
# 1 GB; if a real workload ever hits the new cap, the fix is capacity
# splitting in cft_plan_slices, not widening the group back.
#
# It also moves the scaling wall: 4 pseudo-channels per tile against
# the platform's 32 is a hard wall at EIGHT tiles, where the old
# 4-per-master mapping walled at two. docs/SCALING.md carries the
# analysis.

[connectivity]
nk=cft_krnl:1:cft_krnl_1
sp=cft_krnl_1.m_axi_a:HBM[0]
sp=cft_krnl_1.m_axi_b:HBM[1]
sp=cft_krnl_1.m_axi_c:HBM[2]
sp=cft_krnl_1.m_axi_d:HBM[3]

# Bring-up clock constraint (docs/BRINGUP.md gate 3): the v0 behavioural
# core will not close the platform default. Uncomment to pin the kernel
# clock low; determinism is clock-independent, so results are identical.
#[clock]
#freqHz=100000000:cft_krnl_1
