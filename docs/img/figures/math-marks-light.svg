<svg xmlns="http://www.w3.org/2000/svg" width="900" height="846" viewBox="0 0 900 846" role="img" aria-label="Observed rates of marked (undecided) lanes for the six exp and log routines and for sin, cos and tan, against the law that predicts them: 30 runs, 564,000 lanes, and not one lane that was wrong went unmarked.">
<title>Observed rates of marked (undecided) lanes for the six exp and log routines and for sin, cos and tan, against the law that predicts them: 30 runs, 564,000 lanes, and not one lane that was wrong went unmarked.</title>
<rect width="900" height="846" fill="#ffffff"/>
<text x="24.0" y="30.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#1f2328" font-weight="600">How often a correctly rounded routine has to say 'undecided'</text>
<text x="24.0" y="52.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#656d76">A lane is marked when the routine cannot decide its rounding within the bound, and the host then decides it. Each dot</text>
<text x="24.0" y="69.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#656d76">is a captured run: its marked share of lanes with a 95% binomial interval. The diamond is the rate the first law</text>
<text x="24.0" y="86.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#656d76">predicts; the hollow one, for sin, cos and tan, the rate the lane's own bound predicts. Filled is round to nearest</text>
<text x="24.0" y="103.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#656d76">even, hollow is toward zero.</text>
