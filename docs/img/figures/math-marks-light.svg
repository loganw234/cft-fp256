<text x="24.0" y="749.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#656d76">30 runs, 564,000 lanes: 13,627 marked, and none of the lanes whose rounding was wrong was left unmarked. For sin and cos at binary64 the</text>
