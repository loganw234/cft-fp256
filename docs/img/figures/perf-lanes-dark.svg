<svg xmlns="http://www.w3.org/2000/svg" width="900" height="548" viewBox="0 0 900 548" role="img" aria-label="Elements per second against problem size for the four formats on one resident tile, and the same rates relative to binary256: they climb towards eight, four and two, the number of lanes in a beat.">
<title>Elements per second against problem size for the four formats on one resident tile, and the same rates relative to binary256: they climb towards eight, four and two, the number of lanes in a beat.</title>
<rect width="900" height="548" fill="#0d1117"/>
<text x="24.0" y="30.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#e6edf3" font-weight="600">The tile is beat-limited: throughput follows the lanes in a beat</text>
<text x="24.0" y="52.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#9198a1">One resident tile, multiply. Left: elements per second against problem size. Right: the same rates relative to</text>
<text x="24.0" y="69.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#9198a1">binary256 at the same size. A beat carries 8, 4, 2 or 1 elements, so the ratios should settle at 8, 4 and 2 - and</text>
<text x="24.0" y="86.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#9198a1">they climb to them as the call gets big enough to hide its fixed cost.</text>
