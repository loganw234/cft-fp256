<text x="24.0" y="572.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#656d76">Grey: the shell and crossbar. Bold names are the two layouts built so far; the others are placeholders until narrow variants are packaged.</text>
