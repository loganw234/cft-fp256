<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="The four binary formats drawn to scale across one 256-bit beat: one binary256 lane, two binary128, four binary64 or eight binary32.">
<title>The four binary formats drawn to scale across one 256-bit beat: one binary256 lane, two binary128, four binary64 or eight binary32.</title>
<rect width="900" height="470" fill="#ffffff"/>
<text x="24.0" y="30.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#1f2328" font-weight="600">One 256-bit beat, and the four formats it carries</text>
<text x="24.0" y="52.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#656d76">The tile moves one 256-bit beat at a time. Each row is that beat cut into the lanes of one format, every field to</text>
<text x="24.0" y="69.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#656d76">scale: sign, exponent, trailing significand. The widths are the golden model's own.</text>
