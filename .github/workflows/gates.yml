#
# The gates. Job one proves the golden model against arbiters that
# share no code with it (native binary64, math.fma, mpmath, GNU MPFR
# through gmpy2, and the hand-written IEEE 754 anchors). Job two proves
# the RTL against the golden model, streamed, plus the full kernel
# through AXI, as one job a bench group. Job three
# elaborates every RTL file in Yosys, which is what keeps the open-core
# port a wrapper rather than a fork. Job four
# builds the host library and runs every language that calls it,
# through verify/run.sh, each binding and example a named stage that
# is required to run rather than allowed to skip.
#
# What the jobs run on, and why mpmath and gmpy2 are pinned. READ from run
# 39702228205 at f707fa3 (2026-10-22, every job green): golden on CPython
# 3.13.16 with mpmath 1.4.1, gmpy2 2.2.1 and pytest 9.1.1; host on 3.12.15
# with mpmath 1.4.1, gmpy2 2.3.2, numpy 2.5.4 and pytest 9.1.1; each rtl job
# on 3.12.15 with mpmath 1.4.1, cocotb 1.9.2 and cocotbext-axi 0.1.28. mpmath
# and gmpy2 are pinned below to exactly those, in every job that installs
# them, so that a new release reaches CI when someone moves a pin and not
# unannounced; until 2026-10-22 only golden's gmpy2 was pinned, and CI ran
# mpmath 1.4.1 where the desktop runs 1.3.0. Both satisfy python/pyproject.toml's
# floors (mpmath>=1.3, gmpy2>=2.2.1). The two jobs that install gmpy2 pin
# different versions because each keeps what it last ran; moving host to
# golden's 2.2.1, the desktop's, is a change for a run to confirm.
#
# The golden job's CPython is not the desktop's - 3.13 where the desktop and
# the other jobs run 3.12 - and stays so on purpose. math.fma, one of the
# arbiters named above, exists from 3.13; python/tests/test_softfloat.py's
# test_fp64_fma_matches_math_fma skips below that, as it does on the
# desktop's 3.12.9. Moving this job to 3.12 would take that arbiter out of CI
# without turning anything red.
#
# What a green tick does NOT cover: synthesis, timing, package_xo,
# v++ linking, and behaviour on a physical card. Those gates live in
# docs/BRINGUP.md and need licensed tools and hardware.

name: gates
on: [push, pull_request]

# Only the tip of a branch is worth a runner. The `host` job alone takes
# about an hour and a half, so a run of four commits pushed over twenty
# minutes - which is what 2026-09-13 looked like - left three obsolete
# runs grinding to a verdict nobody would read, on code main had already
# moved past. Superseded runs are cancelled; the group is per-ref, so
# branches and pull requests never cancel each other, and `pages` keeps
# its own group.
#
# What this costs, stated because it is a real trade: an intermediate
# commit pushed and then superseded within the hour gets no verdict of
# its own. "main is green" then means the TIP is green, which is what it
# has to mean for the cost to be bearable - and a commit that needs its
# own answer can always get one from `gh run rerun` or a `verify/run.sh`
# census, which is the record docs/VALIDATION.md actually keeps.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # gmpy2 brings GNU MPFR, test_mpfr_parity's oracle. Until 2026-10-13
      # this job did not install it, and test_transcend.py then skipped
      # itself whole, so none of its 884 tests ran here. 2.2.1 is the
      # desktop's. The import step fails the job if gmpy2 is absent, where
      # test_mpfr_parity would only skip; a gmpy2 that is there and will
      # not load fails collection too. mpmath 1.4.1 is what the job took
      # unpinned until 2026-10-22.
      - run: pip install pytest mpmath==1.4.1 gmpy2==2.2.1
      - run: python -c "import gmpy2; print('gmpy2', gmpy2.version(), gmpy2.mpfr_version(), gmpy2.mp_version())"
      # -rs: the log names each test it skipped and why. It said "5453 passed,
      # 2 skipped" and no more (run 39702228205), and a skip that CI hides is
      # a test nobody knows is not running. Those two are believed to be
      # test_serial_replay.py's, skipped for want of the loopback binary this
      # job does not build; the next run's log says.
      - run: python -m pytest python/tests -q -rs

  # The RTL suite runs as one job a group (tb/Makefile's SIM_GROUPS, since
  # 2026-10-19). As one job it took 4 h 28 min to 5 h 39 min of the hosted
  # runner's six hours, and one run hit that limit (582953c's, cancelled
  # at 6 h 00 min, 2026-10-16). The groups are read from the Makefile, not
  # listed here, and `print-sim-groups` refuses a split that leaves a bench
  # out or names one twice, so this matrix is the whole suite, once.
  rtl-groups:
    runs-on: ubuntu-24.04
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
      # assigned first, so that a refusal fails this step (bash -e) rather
      # than handing the matrix an empty list; printed, so that the log shows
      # the list the matrix was handed and not only the jobs it made
      # (until 2026-10-22 it went to the output file alone)
      - id: groups
        run: |
          groups=$(make -C tb -s --no-print-directory print-sim-groups)
          echo "rtl groups: $groups"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  rtl:
    needs: rtl-groups
    name: rtl (group ${{ matrix.group }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.rtl-groups.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # verilator alongside iverilog: the segmented shifter bench is 720
      # bits by twenty stages of multiplexer and Icarus takes hours on
      # it where Verilator takes a second, so tb/Makefile pins that
      # target to Verilator; normshare, whose four banks that shifter
      # feeds, reads the same pin. Every other target still runs on
      # Icarus, which keeps the default simulator the one the rest of
      # the suite is written for.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends iverilog verilator
      # tb/requirements.txt holds mpmath's floor (>=1.3); the pin is CI's,
      # the version these jobs took (1.4.1) until it was written
      - run: pip install -r tb/requirements.txt mpmath==1.4.1
      - run: make -C tb sim-group-${{ matrix.group }}

  portability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends yosys
      - run: make yosys-lint

  # The host library and every language that calls it, through the same
  # runner a person uses, so a push that breaks a binding or a language
  # example fails here by name. --require-all: a stage that skipped
  # because the image lost a toolchain FAILS rather than passing by
  # omission. Julia and R are not on the image and stay on the dated
  # rows in docs/COMPATIBILITY.md; Rust, Go and .NET are on it, gfortran
  # is one apt line, and the language stages regenerate the vectors they
  # replay when the vectors stage did not run first.
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gfortran
      # pinned to what this job last ran (the header says why); numpy and
      # pytest are not
      - run: pip install pytest mpmath==1.4.1 gmpy2==2.3.2 numpy
      # `docs` and `generated` lead because they are the two that catch
      # drift rather than breakage, and are cheap: about a minute each
      # (on the maintainer's desktop on 2026-10-19, docs took 29 to 39 s
      # and generated 45 to 74 s, the top of that with the library built
      # cold; since that day generated has included the status packager's
      # self-test, about 50 s of it, which needs no converter, no Pillow
      # and no PyMuPDF and prints no SKIP, so --require-all holds). Neither
      # was in this list before 2026-09-13, which is how six stale stage
      # counts and two stale generated artifacts reached main: the stages
      # existed, sat in the quick budget, and nothing on push selected
      # them. A gate that CI does not name is a gate that does not run.
      #
      # `innerskips` and `ensurevectors` are the runner's own two self-tests
      # (verify/test-inner-skips.sh: how a skip inside a passing stage is
      # counted, and how the mpfr stage names its MPFR; verify/test-ensure-
      # vectors.sh: when vectors/out is reused and when it is regenerated,
      # and that every stage that can regenerate it names what that needs),
      # and `seq` is the sequencer differential (host/tests/seq_check.py: the
      # C sequencer against the model over fuzzed programs in eight corpora;
      # the routine corpus needs the mpmath and pytest this job installs, or
      # it prints a SKIP that --require-all fails). All three are in the
      # quick budget and were left out of this list until 2026-10-22
      # (KL-607, KL-181), so a push that broke the runner's counting, or the
      # C sequencer alone, passed here. On the maintainer's desktop that day,
      # niced and under --require-all, in a Linux clone (WSL, Ubuntu 22.04)
      # innerskips took 3 s, ensurevectors 40 s and seq 44 s, and 90 s, 49 s
      # and 36 s through the Windows runner; four stages this job already runs
      # took 26 s here (augmented, formatof, reduce, status96, run
      # 39702228205) against 28 s there. The three are believed to add about
      # two minutes to this job's 6,319 s; the next run's log has the figure.
      - run: bash verify/run.sh --require-all --only docs,generated,buildargs,sweepjudge,innerskips,ensurevectors,vectors,libcft,augmented,reduce,seq,programs,character,formatof,status96,bindings,cpp,lang-cpp,lang-rust,lang-go,lang-csharp,lang-fortran,node,wasm,workloads,demos
