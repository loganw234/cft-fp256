# Publish the browser pages to GitHub Pages.
#
# The first two pages are COMMITTED build products, byte-reproducible
# from the pinned emsdk container (see bindings/wasm/README.md), so this
# workflow builds nothing: it serves the files the repo already
# vouches for.
#
#   conformance.html  the replay of the published vector sets, served
#                     as index.html at the site root - anyone with a
#                     browser can check the contract without cloning
#                     anything.
#   demos.html        the five contract workloads of docs/BENCHMARKS.md,
#                     each panel a port of one C tool's loop engine
#                     (zoom's and orbits' of the program engine too),
#                     each chain printed beside the chain the native
#                     tool produced (docs/DEMOS.md).
#   nightly.html      how far the card's nightly stress run has come:
#                     hand-written, not a build product, and reading
#                     nightly.json beside it, which hw/card_stress_progress.py
#                     makes from the run's record and which is committed
#                     each morning (docs/CARDDAY.md). Both live in site/.
#
# conformance.html is staged TWICE, as index.html and under its own
# name, because demos.html links to it by that name and a relative link
# that works from a checkout should work on the site too.
name: pages
on:
  push:
    branches: [main]
    paths:
      - bindings/wasm/conformance.html
      - bindings/wasm/demos.html
      - site/nightly.html
      - site/nightly.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: stage the pages
        run: |
          mkdir -p _site
          cp bindings/wasm/conformance.html _site/index.html
          cp bindings/wasm/conformance.html _site/conformance.html
          cp bindings/wasm/demos.html _site/demos.html
          cp site/nightly.html _site/nightly.html
          cp site/nightly.json _site/nightly.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
