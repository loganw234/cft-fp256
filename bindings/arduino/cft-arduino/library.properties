sentence=Deterministic IEEE 754-2019 binary32/64/128/256 arithmetic, bit-identical to the golden model and to the FPGA.
paragraph=libcft on a microcontroller. Integer arithmetic over 32-bit limbs, no floating-point hardware used and none needed, so a Pico with no FPU and an ATmega with no multiplier produce the same bits as a host and as the card. Add, subtract, multiply, fused multiply-add, divide, square root, the reductions, the clause-5 completion set, augmented arithmetic, and on a 32-bit board the 39 correctly rounded transcendentals and the 5.12 character conversions. Five rounding attributes, five exception flags. The VectorReplay example answers host/tools/serial_replay.py over the UART so the published conformance vectors can be replayed through the board itself.
